<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0a0a0a;
    }
    #root {
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>
</head>
<body>
    <div data-hf-id="hf-main" id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="45">
    <div class="clip" id="scene-screenshot" data-hf-id="hf-sc1" data-composition-id="channel-screenshot"
         data-composition-src="compositions/channel-screenshot.html" data-start="0" data-duration="12" data-track-index="0" data-width="1920" data-height="1080"></div>
    <div class="clip" id="scene-subscribe" data-hf-id="hf-sc2" data-composition-id="subscribe-cta"
         data-composition-src="compositions/subscribe-cta.html" data-start="13" data-duration="17" data-track-index="1" data-width="1920" data-height="1080"></div>
    <div class="clip" id="scene-end" data-hf-id="hf-sc3" data-composition-id="end-card"
         data-composition-src="compositions/end-card.html" data-start="31" data-duration="14" data-track-index="2" data-width="1920" data-height="1080"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to("#root", { opacity: 1, duration: 45 }, 0);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
